# 在 macOS runner 上构建 darwin/arm64 应用，生成可验证的构建来源证明（provenance），
# 并把产物上传到对应的 GitHub Release。
#
# 为什么不用 slsa-framework/slsa-github-generator 的 Go builder：
#   1. 该 builder 的所有 job 固定 runs-on: ubuntu-latest，且不对外暴露 runner 参数；
#   2. Wails 的 macOS 后端是 cgo + Objective-C（internal/frontend/desktop/darwin
#      下 11 个文件 import "C"，LDFLAGS 依赖 Foundation/Cocoa/WebKit 框架），
#      Linux 上没有 macOS SDK，无法编译出 darwin 产物；
#   3. 该仓库官方已声明停止维护，建议改用 GitHub artifact attestations。
# 因此这里改为在 macOS 上原生构建，并用 GitHub 官方的 attest-build-provenance
# 生成 provenance，同样可用 `gh attestation verify` 校验。
name: SLSA Go releaser

on:
  release:
    types: [created]

permissions:
  contents: write      # 上传 Release 资产
  id-token: write      # 生成 provenance 需要 OIDC token
  attestations: write  # 写入构建来源证明

jobs:
  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI（版本与 go.mod 保持一致）
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # wails build 会按 wails.json 自动执行 npm install 与 npm run build，
      # 前端产物 frontend/dist 由 main.go 的 embed 打进二进制。
      - name: 构建 macOS arm64 应用
        run: wails build -platform darwin/arm64 -clean -trimpath

      # attestation 的 subject 只能是文件，.app 是目录，需先打包。
      - name: 打包 .app 为 zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/brew-manager.app dist/brew-manager-darwin-arm64.zip

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/brew-manager-darwin-arm64.zip

      - name: 上传产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/brew-manager-darwin-arm64.zip \
            --clobber
