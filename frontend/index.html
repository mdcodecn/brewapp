<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Brew Manager</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <svg class="logo" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span class="app-title">Brew Manager</span>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" data-tab="dashboard">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
                <span>概览</span>
            </button>
            <button class="nav-item" data-tab="installed">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span>已安装</span>
            </button>
            <button class="nav-item" data-tab="search">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>搜索</span>
            </button>
            <button class="nav-item" data-tab="outdated">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
                </svg>
                <span>可更新</span>
                <span class="badge" id="outdated-badge" style="display:none;">0</span>
            </button>
            <button class="nav-item" data-tab="dependencies">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                <span>依赖</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>设置</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <div id="brew-version" class="brew-version">Loading...</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Dashboard -->
        <div class="tab-content active" id="tab-dashboard">
            <div class="page-header">
                <h1>概览</h1>
                <button class="btn btn-primary" onclick="refreshDashboard()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    刷新
                </button>
            </div>
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-blue">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="stat-total">-</div>
                        <div class="stat-label">已安装包</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-green">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="stat-casks">-</div>
                        <div class="stat-label">应用 (Cask)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-orange">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="stat-outdated">-</div>
                        <div class="stat-label">可更新</div>
                    </div>
                </div>
            </div>
            <div class="dashboard-section">
                <h2>磁盘使用</h2>
                <div class="disk-usage-grid" id="disk-usage-grid"></div>
            </div>
            <div class="dashboard-section">
                <h2>最近操作</h2>
                <div id="recent-actions" class="action-list">
                    <p class="empty-state">暂无操作记录</p>
                </div>
            </div>
        </div>

        <!-- Installed -->
        <div class="tab-content" id="tab-installed">
            <div class="page-header">
                <h1>已安装</h1>
                <div class="header-actions">
                    <input type="text" id="installed-search" class="search-input" placeholder="搜索..." oninput="filterInstalled()">
                    <select id="installed-filter" class="filter-select" onchange="filterInstalled()">
                        <option value="all">全部</option>
                        <option value="cask">应用</option>
                        <option value="formula">公式</option>
                    </select>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr><th>名称</th><th>版本</th><th>类型</th><th>描述</th><th>操作</th></tr>
                    </thead>
                    <tbody id="installed-tbody">
                        <tr><td colspan="5" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Search -->
        <div class="tab-content" id="tab-search">
            <div class="page-header"><h1>搜索</h1></div>
            <div class="search-box">
                <input type="text" id="search-input" class="search-input search-input-lg" placeholder="搜索 Homebrew 公式或应用..." oninput="debounceSearch()">
            </div>
            <div id="search-results" class="results-list">
                <p class="empty-state">输入关键词搜索 Homebrew 包</p>
            </div>
        </div>

        <!-- Outdated -->
        <div class="tab-content" id="tab-outdated">
            <div class="page-header">
                <h1>可更新</h1>
                <button class="btn btn-primary" id="upgrade-all-btn" onclick="upgradeAll()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
                    </svg>
                    全部更新
                </button>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr><th>名称</th><th>当前版本</th><th>类型</th><th>操作</th></tr>
                    </thead>
                    <tbody id="outdated-tbody">
                        <tr><td colspan="4" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Dependencies -->
        <div class="tab-content" id="tab-dependencies">
            <div class="page-header"><h1>依赖管理</h1></div>
            <div class="dependency-section">
                <h2>查找包的依赖</h2>
                <div class="dependency-search">
                    <input type="text" id="dep-search-input" class="search-input" placeholder="输入包名查看依赖...">
                    <button class="btn btn-primary" onclick="loadDependencies()">查询</button>
                </div>
                <div id="dependency-results" class="dependency-results">
                    <p class="empty-state">输入包名查看其依赖关系</p>
                </div>
            </div>
            <div class="dependency-section">
                <h2>孤立依赖清理</h2>
                <p class="dependency-hint">清理不再被任何已安装包依赖的孤立依赖包，释放磁盘空间。</p>
                <button class="btn btn-warning" onclick="autoremoveDeps()">执行清理</button>
                <div id="autoremove-result" class="autoremove-result"></div>
            </div>
        </div>

        <!-- Settings -->
        <div class="tab-content" id="tab-settings">
            <div class="page-header"><h1>设置</h1></div>
            <div class="settings-section">
                <h2>Brew 信息</h2>
                <div class="info-list" id="brew-info-list"></div>
            </div>
            <div class="settings-section">
                <h2>Taps 管理</h2>
                <div class="tap-add-row">
                    <input type="text" id="tap-input" class="search-input" placeholder="输入 tap 名称，如: homebrew/cask">
                    <button class="btn btn-primary" onclick="addTap()">添加 Tap</button>
                </div>
                <div id="taps-list" class="tap-list" style="margin-top:12px;"></div>
            </div>
            <div class="settings-section">
                <h2>磁盘使用详情</h2>
                <div id="disk-usage-detailed" class="disk-usage-grid"></div>
            </div>
            <div class="settings-section">
                <h2>数据管理</h2>
                <div class="settings-actions">
                    <button class="btn btn-secondary" onclick="exportConfig()">导出配置</button>
                    <button class="btn btn-secondary" onclick="cleanupBrew()">清理缓存</button>
                    <button class="btn btn-warning" onclick="autoremoveDeps()">清理孤立依赖</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Confirm Modal -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">确认</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- Package Detail Modal -->
    <div id="detail-modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 id="detail-modal-title">包详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detail-modal-body">
                <div class="spinner" style="margin:20px auto;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
                <button class="btn btn-primary" id="detail-modal-action"></button>
            </div>
        </div>
    </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
